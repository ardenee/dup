<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening DUP</title>
</head>
<body>
<p>Opening DUP over HTTPS…</p>
<script>
"use strict";
// DSM's management UI can use port 5001; DUP's Web Station HTTPS portal is 443.
const target = "https://" + window.location.hostname + "/dup/";
const link = document.createElement("a");
link.href = target;
link.textContent = "Open DUP";
document.body.appendChild(link);
window.location.replace(target);
</script>
</body>
</html>
