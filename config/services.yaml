parameters:
services:
    _defaults:
        autowire: true
        autoconfigure: true
    _instanceof:
        App\Core\Module\ModuleInterface:
            tags: ['dup.module']
    App\:
        resource: '../src/'
    App\Module\Profiles\Service\DirectoryBrowser:
        arguments:
            $configuredRoots: '%env(DUP_ALLOWED_SCAN_ROOTS)%'
